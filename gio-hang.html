<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Giỏ hàng — Cỏ Thơm</title>
  <link rel="stylesheet" href="css/user.css" />
</head>
<body>
  <div id="site-header"></div>
  <main class="wrap" id="cart-root"></main>
  <div id="checkout-overlay" class="overlay hidden" onclick="if(event.target===this)closeOverlays()">
    <div class="modal">
      <h2 class="font-display">Thanh toán</h2>
      <p class="muted" id="checkout-total"></p>
      <form onsubmit="placeOrder(event)">
        <div class="field"><label>Họ tên</label><input name="name" required></div>
        <div class="field"><label>Số điện thoại</label><input name="phone" type="tel" pattern="0( ?[0-9]){9}" title="Số điện thoại gồm 10 chữ số, bắt đầu bằng 0" required></div>
        <p class="muted" style="font-size:12px;margin-top:12px">Địa chỉ nhận hàng</p>
        <label class="checkout-save-address"><input type="radio" name="addressMode" value="saved" onchange="setAddressMode(this.value)"> Dùng địa chỉ trong tài khoản</label>
        <label class="checkout-save-address"><input type="radio" name="addressMode" value="new" onchange="setAddressMode(this.value)"> Nhập địa chỉ giao hàng mới</label>
        <div id="saved-address-box" class="field"><label>Chọn địa chỉ đã lưu</label><select name="savedAddress"></select></div>
        <div id="new-address-box">
          <div class="field"><label>Số nhà, tên đường</label><input name="street" placeholder="Ví dụ: 24 Nguyễn Huệ"></div>
          <div class="field"><label>Phường / Xã</label><input name="ward" placeholder="Ví dụ: Phường Sài Gòn"></div>
          <div class="field"><label>Tỉnh / Thành phố</label><select name="province"></select></div>
          <label class="checkout-save-address"><input name="saveAddress" type="checkbox"> Lưu địa chỉ này vào tài khoản</label>
        </div>
        <div class="field">
          <label>Phương thức</label>
          <select name="payment" onchange="checkoutPaymentChanged(this.value)">
            <option value="COD">Tiền mặt khi nhận hàng (mặc định)</option>
            <option value="Bank">Chuyển khoản</option>
            <option value="Online">Thanh toán trực tuyến</option>
          </select>
        </div>
        <p class="muted checkout-payment-note" id="checkout-payment-note">Thanh toán tiền mặt khi nhận hàng.</p>
        <button class="btn btn-rose" style="width:100%" type="submit">Đặt hàng</button>
      </form>
    </div>
  </div>
  <div id="success-overlay" class="overlay hidden" onclick="if(event.target===this)closeOverlays()">
    <div class="modal wide">
      <div style="text-align:center">
        <div class="empty-icon">✓</div>
        <h2 class="font-display">Đặt hàng thành công</h2>
      </div>
      <div id="order-review" style="margin:12px 0 20px"></div>
      <button class="btn btn-rose" onclick="location.href='index.html'">Tiếp tục mua sắm</button>
      <button class="btn-outline" onclick="openAccount('orders')">Xem đơn hàng của tôi</button>
    </div>
  </div>
  <div id="site-footer"></div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    function renderCart() {
      const { items, subtotal, shipping, total } = cartTotals();
      const root = document.getElementById("cart-root");
      if (!getUser()) {
        root.innerHTML = `<div class="empty">
          <div class="empty-icon">🔒</div>
          <h2 class="font-display">Vui lòng đăng nhập để dùng giỏ hàng</h2>
          <p class="muted" style="margin:10px 0 22px">Bạn cần có tài khoản và đăng nhập trước khi mua hàng.</p>
          <button class="btn btn-rose" onclick="openAuth('login')">Đăng nhập</button>
          <button class="btn-outline" onclick="openAuth('register')">Đăng ký</button>
        </div>`;
        return;
      }
      if (!items.length) {
        root.innerHTML = `<div class="empty">
          <div class="empty-icon">👜</div>
          <h2 class="font-display">Giỏ hàng của bạn đang trống</h2>
          <p class="muted" style="margin:10px 0 22px">Thêm những sản phẩm tuyệt vời để bắt đầu.</p>
          <button class="btn btn-rose" onclick="goCatalog('')">Tiếp tục mua sắm</button>
        </div>`;
        return;
      }
      const remain = Math.max(0, 600000 - subtotal);
      root.innerHTML = `
        <nav class="crumb"><button onclick="location.href='index.html'">Trang chủ</button> / <span>Giỏ hàng</span></nav>
        <h1>Giỏ hàng</h1>
        ${remain ? `<div class="rev" style="margin:18px 0">🚚 Thêm ${money(remain)} nữa để được miễn phí vận chuyển.</div>` : `<div class="rev" style="margin:18px 0">✓ Đơn hàng của bạn được miễn phí vận chuyển.</div>`}
        <div class="cart-layout">
          <div>${items.map(({ product, quantity }) => `
            <div class="cart-item">
              <img src="${product.images[0]}" alt="${product.name}" onclick="location.href='san-pham.html?id=${product.id}'">
              <div>
                <div class="brand">${product.brand}</div>
                <b>${product.name}</b>
                <div class="muted">${money(product.price)}</div>
                <div class="qty" style="margin-top:8px">
                  <button onclick="updateQty('${product.id}', ${quantity - 1}); renderCart()">−</button>
                  <span>${quantity}</span>
                  <button onclick="updateQty('${product.id}', ${quantity + 1}); renderCart()">+</button>
                </div>
              </div>
              <div style="text-align:right">
                <div class="price">${money(product.price * quantity)}</div>
                <button class="btn-ghost" onclick="removeFromCart('${product.id}'); renderCart()">Xóa</button>
              </div>
            </div>`).join("")}</div>
          <aside class="summary">
            <h3 class="font-display">Tóm tắt đơn hàng</h3>
            <div class="line"><span>Tạm tính</span><span>${money(subtotal)}</span></div>
            <div class="line"><span>Vận chuyển</span><span>${shipping ? money(shipping) : "Miễn phí"}</span></div>
            <div class="line total"><span>Tổng</span><span>${money(total)}</span></div>
            <button class="btn btn-rose" style="width:100%;margin-top:12px" onclick="openCheckout()">Thanh toán</button>
            <button class="btn-ghost" style="width:100%;margin-top:8px" onclick="goCatalog('')">Tiếp tục mua sắm</button>
          </aside>
        </div>`;
    }

    function openCheckout() {
      const user = getUser();
      if (!user) {
        openAuth("login");
        toast("Vui lòng đăng nhập để tiến hành thanh toán.");
        return;
      }
      const { items, total } = cartTotals();
      if (!items.length) {
        toast("Giỏ hàng của bạn đang trống.");
        return;
      }
      document.getElementById("checkout-total").textContent = "Tổng thanh toán: " + money(total);
      const form = document.querySelector("#checkout-overlay form");
      const addresses = savedAddresses(user);
      form.elements.name.value = user.name || "";
      form.elements.phone.value = user.phone || "";
      form.elements.savedAddress.innerHTML = addresses.map((address, index) => `<option value="${index}">${address}</option>`).join("");
      form.elements.province.innerHTML = `<option value="">-- Chọn tỉnh / thành phố --</option>${PROVINCES.map((name) => `<option>${name}</option>`).join("")}`;
      form.elements.street.value = "";
      form.elements.ward.value = "";
      form.elements.saveAddress.checked = false;
      form.querySelector("[value='saved']").disabled = !addresses.length;
      setAddressMode(addresses.length ? "saved" : "new");
      form.elements.payment.value = "COD";
      checkoutPaymentChanged(form.elements.payment.value);
      openOverlay("checkout-overlay");
    }

    // 34 tỉnh / thành phố sau khi sắp xếp lại đơn vị hành chính năm 2025.
    const PROVINCES = [
      "TP. Hà Nội", "TP. Hồ Chí Minh", "TP. Hải Phòng", "TP. Đà Nẵng", "TP. Cần Thơ", "TP. Huế",
      "An Giang", "Bắc Ninh", "Cà Mau", "Cao Bằng", "Đắk Lắk", "Điện Biên", "Đồng Nai", "Đồng Tháp",
      "Gia Lai", "Hà Tĩnh", "Hưng Yên", "Khánh Hòa", "Lai Châu", "Lâm Đồng", "Lạng Sơn", "Lào Cai",
      "Nghệ An", "Ninh Bình", "Phú Thọ", "Quảng Ngãi", "Quảng Ninh", "Quảng Trị", "Sơn La", "Tây Ninh",
      "Thái Nguyên", "Thanh Hóa", "Tuyên Quang", "Vĩnh Long",
    ];

    function savedAddresses(user) {
      return [...new Set([user.address, ...(user.addresses || [])].map((item) => (item || "").trim()).filter(Boolean))];
    }

    // Hai trường hợp địa chỉ: chọn từ tài khoản, hoặc nhập mới (chỉ bắt buộc các ô của trường hợp đang chọn).
    function setAddressMode(mode) {
      const form = document.querySelector("#checkout-overlay form");
      const isNew = mode === "new";
      form.querySelector(`[name='addressMode'][value='${mode}']`).checked = true;
      document.getElementById("saved-address-box").style.display = isNew ? "none" : "block";
      document.getElementById("new-address-box").style.display = isNew ? "block" : "none";
      form.elements.savedAddress.required = !isNew;
      form.elements.street.required = isNew;
      form.elements.ward.required = isNew;
      form.elements.province.required = isNew;
    }

    function checkoutPaymentChanged(value) {
      const note = document.getElementById("checkout-payment-note");
      note.textContent = value === "Bank"
        ? "Thông tin chuyển khoản sẽ hiện ở bước xem lại đơn hàng sau khi đặt."
        : value === "Online"
          ? "Thanh toán trực tuyến đang ở chế độ mô phỏng cho bản demo."
          : "Thanh toán tiền mặt khi nhận hàng.";
    }

    function orderReviewHtml(order) {
      return `
        <p><b>Mã đơn:</b> ${order.id} · Ngày đặt: ${order.date} · Trạng thái: ${order.status}</p>
        <p><b>Người nhận:</b> ${order.name} · ${order.phone}</p>
        <p><b>Giao đến:</b> ${order.address}</p>
        <p><b>Thanh toán:</b> ${paymentLabel(order.payment)}</p>
        ${order.payment === "Bank" ? `<p class="muted">Vui lòng chuyển <b>${money(order.total)}</b> vào tài khoản cửa hàng (thông tin demo):
          Số tài khoản 0000 0000 0000 · Chủ tài khoản CỎ THƠM · Nội dung chuyển khoản: <b>${order.id}</b></p>` : ""}
        <div class="table-wrap" style="margin-top:12px"><table>
          <thead><tr><th>Sản phẩm</th><th>Số lượng</th><th>Đơn giá</th><th>Thành tiền</th></tr></thead>
          <tbody>${order.items.map((item) => `<tr><td>${item.name}</td><td>${item.quantity}</td><td>${money(item.price)}</td><td>${money(item.price * item.quantity)}</td></tr>`).join("")}</tbody>
        </table></div>
        <div class="line"><span>Tạm tính</span><span>${money(order.subtotal)}</span></div>
        <div class="line"><span>Vận chuyển</span><span>${order.shipping ? money(order.shipping) : "Miễn phí"}</span></div>
        <div class="line total"><span>Tổng cộng</span><span>${money(order.total)}</span></div>`;
    }

    function placeOrder(e) {
      e.preventDefault();
      const user = getUser();
      if (!user) {
        closeOverlays();
        openAuth("login");
        return;
      }
      const { items, subtotal, shipping, total } = cartTotals();
      if (!items.length) return;
      const products = loadProducts();
      const unavailable = items.find(({ product, quantity }) => {
        const current = products.find((entry) => String(entry.id) === String(product.id));
        return !isForSale(current) || current.stock < quantity;
      });
      if (unavailable) {
        toast("Số lượng tồn kho đã thay đổi. Vui lòng kiểm tra lại giỏ hàng.");
        return;
      }
      const form = new FormData(e.target);
      const isNewAddress = form.get("addressMode") === "new";
      const address = isNewAddress
        ? [form.get("street"), form.get("ward"), form.get("province")].map((part) => part.toString().trim()).join(", ")
        : savedAddresses(user)[Number(form.get("savedAddress"))];
      if (isNewAddress && form.get("saveAddress") === "on") {
        user.address = address;
        user.addresses = [...new Set([address, ...(user.addresses || [])])];
        setUser(user);
        const accounts = readStored(KEYS.customerAccounts, []);
        const account = accounts.find((item) => item.email === user.email.toLowerCase());
        if (account) {
          account.address = address;
          account.addresses = user.addresses;
          writeStored(KEYS.customerAccounts, accounts);
        }
      }
      const dateISO = todayISO();
      const order = {
        id: "CT-" + Date.now().toString().slice(-6),
        date: formatDate(dateISO),
        dateISO,
        items: items.map((i) => ({ productId: i.productId, quantity: i.quantity, name: i.product.name, price: i.product.price })),
        name: form.get("name"),
        phone: form.get("phone"),
        address,
        email: user.email,
        payment: form.get("payment"),
        subtotal,
        shipping,
        total,
        status: "Mới đặt",
      };
      const movements = readStored(KEYS.stockMovements, []);
      for (const item of items) {
        const product = products.find((entry) => String(entry.id) === String(item.productId));
        product.stock -= item.quantity;
        movements.unshift({
          id: "OUT-" + Date.now() + "-" + item.productId,
          productId: item.productId,
          productName: product.name,
          quantity: item.quantity,
          type: "Xuất bán",
          date: dateISO,
          reference: order.id,
        });
      }
      saveProducts(products);
      writeStored(KEYS.stockMovements, movements);
      saveOrders([order, ...getOrders()]);
      saveCart([]);
      closeOverlays();
      document.getElementById("order-review").innerHTML = orderReviewHtml(order);
      openOverlay("success-overlay");
      renderCart();
    }

    initShop();
    renderCart();
  </script>
</body>
</html>
