<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Giỏ hàng — Cỏ Thơm</title>
  <link rel="stylesheet" href="css/user.css" />
</head>
<body>
  <div id="site-header"></div>
  <main class="wrap" id="cart-root"></main>
  <div id="checkout-overlay" class="overlay hidden" onclick="if(event.target===this)closeOverlays()">
    <div class="modal">
      <h2 class="font-display">Thanh toán</h2>
      <p class="muted" id="checkout-total"></p>
      <form onsubmit="placeOrder(event)">
        <div class="field"><label>Họ tên</label><input name="name" required></div>
        <div class="field"><label>Số điện thoại</label><input name="phone" required></div>
        <div class="field"><label>Chọn địa chỉ đã lưu</label><select name="savedAddress" onchange="checkoutAddressChanged(this.value)"></select></div>
        <div class="field"><label>Địa chỉ giao hàng</label><textarea name="address" rows="2" required></textarea></div>
        <label class="checkout-save-address"><input name="saveAddress" type="checkbox"> Lưu địa chỉ này vào tài khoản</label>
        <div class="field">
          <label>Phương thức</label>
          <select name="payment" onchange="checkoutPaymentChanged(this.value)">
            <option value="COD">Tiền mặt khi nhận hàng (mặc định)</option>
            <option value="Bank">Chuyển khoản</option>
          </select>
        </div>
        <p class="muted checkout-payment-note" id="checkout-payment-note">Thanh toán tiền mặt khi nhận hàng.</p>
        <div class="rev hidden" id="checkout-bank-details">
          <strong>Thông tin chuyển khoản</strong>
          <p>Ngân hàng: Ngân hàng Demo (thông tin mẫu)</p>
          <p>Số tài khoản: 0000000000</p>
          <p>Chủ tài khoản: Trần Thanh Lam</p>
          <p>Nội dung chuyển khoản: <strong id="checkout-transfer-content"></strong></p>
        </div>
        <button class="btn btn-rose" style="width:100%" type="submit">Đặt hàng</button>
      </form>
    </div>
  </div>
  <div id="success-overlay" class="overlay hidden" onclick="if(event.target===this)closeOverlays()">
    <div class="modal" style="text-align:center">
      <div class="empty-icon">✓</div>
      <h2 class="font-display">Đặt hàng thành công</h2>
      <p class="muted" id="success-msg" style="margin:12px 0 20px"></p>
      <button class="btn btn-rose" onclick="location.href='index.html'">Tiếp tục mua sắm</button>
    </div>
  </div>
  <div id="site-footer"></div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
      let checkoutOrderId = null;

      function renderCart() {
      const { items, subtotal, shipping, total } = cartTotals();
      const root = document.getElementById("cart-root");
      if (!items.length) {
        root.innerHTML = `<div class="empty">
          <div class="empty-icon">👜</div>
          <h2 class="font-display">Giỏ hàng của bạn đang trống</h2>
          <p class="muted" style="margin:10px 0 22px">Thêm những sản phẩm tuyệt vời để bắt đầu.</p>
          <button class="btn btn-rose" onclick="goCatalog('')">Tiếp tục mua sắm</button>
        </div>`;
        return;
      }
      const remain = Math.max(0, 600000 - subtotal);
      root.innerHTML = `
        <nav class="crumb"><button onclick="location.href='index.html'">Trang chủ</button> / <span>Giỏ hàng</span></nav>
        <h1>Giỏ hàng</h1>
        ${remain ? `<div class="rev" style="margin:18px 0">🚚 Thêm ${money(remain)} nữa để được miễn phí vận chuyển.</div>` : `<div class="rev" style="margin:18px 0">✓ Đơn hàng của bạn được miễn phí vận chuyển.</div>`}
        <div class="cart-layout">
          <div>${items.map(({ product, quantity }) => `
            <div class="cart-item">
              <img src="${product.images[0]}" alt="${product.name}" onclick="location.href='san-pham.html?id=${product.id}'">
              <div>
                <div class="brand">${product.brand}</div>
                <b>${product.name}</b>
                <div class="muted">${money(product.price)}</div>
                <div class="qty" style="margin-top:8px">
                  <button onclick="updateQty('${product.id}', ${quantity - 1}); renderCart()">−</button>
                  <span>${quantity}</span>
                  <button onclick="updateQty('${product.id}', ${quantity + 1}); renderCart()">+</button>
                </div>
              </div>
              <div style="text-align:right">
                <div class="price">${money(product.price * quantity)}</div>
                <button class="btn-ghost" onclick="removeFromCart('${product.id}'); renderCart()">Xóa</button>
              </div>
            </div>`).join("")}</div>
          <aside class="summary">
            <h3 class="font-display">Tóm tắt đơn hàng</h3>
            <div class="line"><span>Tạm tính</span><span>${money(subtotal)}</span></div>
            <div class="line"><span>Vận chuyển</span><span>${shipping ? money(shipping) : "Miễn phí"}</span></div>
            <div class="line total"><span>Tổng</span><span>${money(total)}</span></div>
            <button class="btn btn-rose" style="width:100%;margin-top:12px" onclick="openCheckout()">Thanh toán</button>
            <button class="btn-ghost" style="width:100%;margin-top:8px" onclick="goCatalog('')">Tiếp tục mua sắm</button>
          </aside>
        </div>`;
    }

    function openCheckout() {
      const user = getUser();
      if (!user) {
        openAuth("login");
        window.__checkoutPending = true;
        document.getElementById("auth-sub").textContent = "Đăng nhập để tiếp tục thanh toán.";
        return;
      }
      const { total } = cartTotals();
      checkoutOrderId = "CT-" + Date.now().toString().slice(-6);
      document.getElementById("checkout-total").textContent = "Tổng thanh toán: " + money(total);
      const form = document.querySelector("#checkout-overlay form");
      const addresses = [...new Set([user.address, ...(user.addresses || [])].map((item) => (item || "").trim()).filter(Boolean))];
      form.elements.name.value = user.name || "";
      form.elements.phone.value = user.phone || "";
      form.elements.savedAddress.innerHTML = `<option value="">Nhập địa chỉ mới</option>${addresses.map((address, index) => `<option value="${index}">${address}</option>`).join("")}`;
      form.elements.address.value = user.address || "";
      form.elements.savedAddress.value = addresses.length ? "0" : "";
      form.elements.saveAddress.checked = false;
      if (addresses.length) form.elements.address.value = addresses[0];
      form.elements.payment.value = "COD";
      checkoutPaymentChanged(form.elements.payment.value);
      openOverlay("checkout-overlay");
    }

    function checkoutAddressChanged(value) {
      const field = document.querySelector("#checkout-overlay [name='address']");
      const user = getUser();
      const addresses = [...new Set([user.address, ...(user.addresses || [])].map((item) => (item || "").trim()).filter(Boolean))];
      if (value === "") {
        field.value = "";
        field.focus();
        return;
      }
      field.value = addresses[Number(value)] || "";
    }

    function checkoutPaymentChanged(value) {
      const note = document.getElementById("checkout-payment-note");
      const bankDetails = document.getElementById("checkout-bank-details");
      note.textContent = value === "Bank" ? "Vui lòng chuyển khoản đúng nội dung để cửa hàng xác nhận đơn." : "Thanh toán tiền mặt khi nhận hàng.";
      bankDetails.classList.toggle("hidden", value !== "Bank");
      document.getElementById("checkout-transfer-content").textContent = checkoutOrderId || "";
    }

    function placeOrder(e) {
      e.preventDefault();
      const user = getUser();
      if (!user) {
        closeOverlays();
        openAuth("login");
        window.__checkoutPending = true;
        document.getElementById("auth-sub").textContent = "Đăng nhập để tiếp tục thanh toán.";
        return;
      }
      const { items, subtotal, shipping, total } = cartTotals();
      if (!items.length) return;
      const products = loadProducts();
      const unavailable = items.find(({ product, quantity }) => {
        const current = products.find((entry) => String(entry.id) === String(product.id));
        return !current || current.hidden || !getCategoryList().some((category) => category.id === current.category) || current.stock < quantity;
      });
      if (unavailable) {
        toast("Số lượng tồn kho đã thay đổi. Vui lòng kiểm tra lại giỏ hàng.");
        return;
      }
      const form = new FormData(e.target);
      const address = form.get("address").toString().trim();
      if (form.get("saveAddress") === "on" && address) {
        user.address = address;
        user.addresses = [...new Set([address, ...(user.addresses || [])])];
        setUser(user);
        const accounts = readStored(KEYS.customerAccounts, []);
        const account = accounts.find((item) => item.email === user.email.toLowerCase());
        if (account) {
          account.address = address;
          account.addresses = user.addresses;
          writeStored(KEYS.customerAccounts, accounts);
        }
      }
      const dateISO = new Date().toISOString().slice(0, 10);
      const order = {
        id: checkoutOrderId || "CT-" + Date.now().toString().slice(-6),
        date: new Date().toLocaleDateString("vi-VN"),
        dateISO,
        items: items.map((i) => ({ productId: i.productId, quantity: i.quantity, name: i.product.name, price: i.product.price })),
        name: form.get("name"),
        phone: form.get("phone"),
        address,
        email: user.email,
        payment: form.get("payment"),
        subtotal,
        shipping,
        total,
        status: "Đang xử lý",
      };
      const movements = readStored(KEYS.stockMovements, []);
      for (const item of items) {
        const product = products.find((entry) => String(entry.id) === String(item.productId));
        product.stock -= item.quantity;
        movements.unshift({
          id: "OUT-" + Date.now() + "-" + item.productId,
          productId: item.productId,
          productName: product.name,
          quantity: item.quantity,
          type: "Xuất bán",
          date: dateISO,
          reference: order.id,
        });
      }
      saveProducts(products);
      writeStored(KEYS.stockMovements, movements);
      saveOrders([order, ...getOrders()]);
      saveCart([]);
      checkoutOrderId = null;
      closeOverlays();
      document.getElementById("success-msg").textContent = "Mã đơn " + order.id + " · " + money(total);
      openOverlay("success-overlay");
      renderCart();
    }

    initShop();
    renderCart();
  </script>
</body>
</html>
